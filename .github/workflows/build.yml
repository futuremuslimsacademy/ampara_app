name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android shell
        run: |
          flutter create --org com.futuremuslimsacademy --project-name ampara_app --platforms=android _shell
          cp -r _shell/android ./android
          [ -f pubspec.yaml ] || cp _shell/pubspec.yaml .
          [ -f analysis_options.yaml ] || cp _shell/analysis_options.yaml .
          [ -d lib ] || cp -r _shell/lib .
          rm -rf _shell
      - name: Set app id, name and internet permission
        run: |
          sed -i -E 's/applicationId\s*=?\s*"[^"]*"/applicationId = "com.futuremuslimsacademy.ampara"/' android/app/build.gradle*
          sed -i 's/android:label="[^"]*"/android:label="ফিউচার মুসলিমস একাডেমি: আমপারা"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ampara-apk
          path: build/app/outputs/flutter-apk/app-release.apk
